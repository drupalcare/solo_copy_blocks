# Drupal.org GitLab CI for solo_copy_blocks.
#
# For details on customizing this file see:
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal/gitlab-ci
# https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

# info.yml and composer.json claim `^10.1 || ^11 || ^12`, so every major gets a
# job: current (Drupal 11, template default), previous minor (11), previous
# major (10) and next major (core main-dev; 12.0-dev as of 2026-10-10).
#
# TWO SWITCHES PER VARIANT, NOT ONE. `OPT_IN_TEST_*` (default '0') creates the
# job; `_AUTORUN_*` (default 'none') decides whether it runs or sits behind a
# manual prerequisite. With only the opt-in set, the job shows as
# `manual`/`skipped` while the pipeline reports success: a green pipeline with
# no coverage, which is worse than a missing job because it looks fine.
#
# This file was first copied from reference_blocked_users, which does not claim
# Drupal 10, so the previous-major pair was missing here and Drupal 10 was
# claimed but never tested in CI (found by the 2026-10-10 support matrix).
variables:
  OPT_IN_TEST_NEXT_MAJOR: '1'
  _AUTORUN_NEXT_MAJOR: 'all'
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
